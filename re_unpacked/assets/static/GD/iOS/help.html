		function createElement() {
			var rootElement = document.getElementById('rootElement');
			var u = navigator.userAgent;
			var isAndroid = u.indexOf('Android') > -1 || u.indexOf('Linux') > -1; //android终端或者uc浏览器
			var index = 0;
			for (var i = 0; i < arr.length; i++) {
				var phonetype = arr[i].phonetype;
				if (phonetype != undefined) {
					if (isAndroid && phonetype == 'android') {} else if (!isAndroid && phonetype == 'ios') {} else {
						continue;
					}
				}
				var div = document.createElement("div");
				rootElement.appendChild(div);
				var strong = document.createElement("strong");
				strong.classList.add("title");
				strong.id = arr[i].id;
				strong.innerText = (++index) + ".   " + arr[i].quest;
				div.appendChild(strong);
				var p = document.createElement('p');
				p.classList.add("QuestAndSwer");
				p.innerText = arr[i].answer;
				var p2 = document.createElement('p');
				div.appendChild(p);
				var h3 = document.createElement('h3');
				h3.innerText = "处理步骤："
				div.appendChild(h3);
				p2.classList.add("QuestAndSwer");
				p2.innerHTML = handleN(arr[i].fun);
				div.appendChild(p2);
			}
		}

		/**
		 * zhangliangming 2019.12.19
		 * @param {Object} type 类型:html（网页）、permission（权限）、location（位置服务）、vpnservice（vpn服务）
		 * @param {Object} url 跳转地址
		 */
		function openUrl(type, url) {
			var obj = {
				url: url,
				type: type
			};
			window.parent.postMessage(JSON.stringify(obj), '*');
		}

		function handleN(funString) {
			return funString.replace(/\n/g, "<br>");
		}

		function QueryString(name) {
			var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)", "i");
			var r = window.location.search.substr(1).match(reg);
			if (r != null) return unescape(r[2]);
			return null;
		}
